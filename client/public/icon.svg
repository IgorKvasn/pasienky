<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <g clip-path="url(#circle)">
    <!-- Wave 1 - top, large -->
    <path d="M-50 200 C60 140, 180 140, 256 200 C332 260, 452 260, 562 200 L562 512 L-50 512 Z" fill="#1976D2"/>

    <!-- Wave 2 -->
    <path d="M-50 270 C80 210, 180 210, 256 270 C332 330, 432 330, 562 270 L562 512 L-50 512 Z" fill="#1565C0"/>

    <!-- Wave 3 -->
    <path d="M-50 340 C70 280, 190 280, 276 340 C362 400, 442 400, 562 340 L562 512 L-50 512 Z" fill="#0D47A1"/>

    <!-- Wave 4 - bottom -->
    <path d="M-50 400 C80 350, 190 350, 276 400 C362 450, 452 450, 562 400 L562 512 L-50 512 Z" fill="#0A3780"/>
  </g>
</svg>
